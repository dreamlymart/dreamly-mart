<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dreamly Mart | Shopping Just Got Easier</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/home.css">
</head>

<body>

  <!-- Header -->
  <header class="header">

    <div class="logo">
      <img src="images/logo-header.png" alt="Dreamly Mart">
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search products...">
      <button>🔍</button>
    </div>

    <div class="header-icons">
      <span>🛒</span>
      <span>👤</span>
    </div>

  </header>

<!-- Hero Banner -->
<section class="hero-banner">

    <div class="hero-content">

        <span class="hero-tag">✨ SMART SHOPPING, BETTER LIVING</span>

        <h1>
            Shopping Just Got
            <span>Easier.</span>
        </h1>

        <p>
            আপনার পছন্দের পণ্য এখন আরও সহজে,
            দ্রুত এবং বিশ্বাসের সাথে।
        </p>

        <div class="hero-buttons">
            <a href="#products" class="hero-btn primary-btn">
                🛍️ Shop Now
            </a>

            <a href="#categories" class="hero-btn secondary-btn">
                Explore Products
            </a>
        </div>

    </div>

</section>

  <!-- Featured Categories -->
  <section class="categories">

      <h2>Featured Categories</h2>

      <div class="category-grid">

      </div>

  </section>

  <!-- Top Selling -->
  <section class="products">

      <h2>Top Selling Products</h2>

      <div class="product-grid">

      </div>

  </section>

  <!-- New Arrival -->
  <section class="products">

      <h2>New Arrivals</h2>

      <div class="product-grid">

      </div>

  </section>

  <!-- Footer -->
  <footer class="footer">

      <p>© 2026 Dreamly Mart</p>

  </footer>

  <script src="js/app.js"></script>

</body>
</html>
